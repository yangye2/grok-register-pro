name: Build Docker Image

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      push:
        description: "Push image to registry"
        type: boolean
        default: true
      platforms:
        description: "Build platforms"
        type: choice
        options:
          - linux/amd64
          - linux/amd64,linux/arm64
        default: linux/amd64

permissions:
  contents: read
  packages: write

env:
  # Fixed owner: yangye2
  GHCR_IMAGE: ghcr.io/yangye2/grok-register-pro
  DOCKERHUB_USER_DEFAULT: yangye2
  DOCKERHUB_IMAGE_DEFAULT: grok-register-pro

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h

      - name: Set up QEMU
        if: github.event_name == 'workflow_dispatch' && contains(github.event.inputs.platforms, 'arm64')
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve image names
        id: names
        shell: bash
        run: |
          GHCR="${{ env.GHCR_IMAGE }}"
          echo "ghcr_image=${GHCR}" >> "$GITHUB_OUTPUT"

          # Prefer secrets override; default user yangye2
          DH_USER="${{ secrets.DOCKERHUB_USERNAME }}"
          if [[ -z "$DH_USER" ]]; then
            DH_USER="${{ env.DOCKERHUB_USER_DEFAULT }}"
          fi
          DH_IMAGE="${{ secrets.DOCKERHUB_IMAGE }}"
          if [[ -z "$DH_IMAGE" ]]; then
            DH_IMAGE="${{ env.DOCKERHUB_IMAGE_DEFAULT }}"
          fi
          # Enable Docker Hub only when token is configured
          if [[ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]]; then
            echo "dockerhub_image=${DH_USER}/${DH_IMAGE}" >> "$GITHUB_OUTPUT"
            echo "dockerhub_user=${DH_USER}" >> "$GITHUB_OUTPUT"
            echo "dockerhub_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "dockerhub_image=" >> "$GITHUB_OUTPUT"
            echo "dockerhub_user=" >> "$GITHUB_OUTPUT"
            echo "dockerhub_enabled=false" >> "$GITHUB_OUTPUT"
          fi
          echo "GHCR image: ${GHCR}"
          echo "Docker Hub enabled: token_set=${{ secrets.DOCKERHUB_TOKEN != '' }}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.names.outputs.dockerhub_enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ steps.names.outputs.dockerhub_user }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image list
        id: images
        shell: bash
        run: |
          imgs="${{ steps.names.outputs.ghcr_image }}"
          if [[ "${{ steps.names.outputs.dockerhub_enabled }}" == "true" && -n "${{ steps.names.outputs.dockerhub_image }}" ]]; then
            imgs="${imgs}"$'\n'"${{ steps.names.outputs.dockerhub_image }}"
          fi
          {
            echo "list<<EOF"
            echo "$imgs"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.images.outputs.list }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Decide push
        id: push
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "push=${{ github.event.inputs.push }}" >> "$GITHUB_OUTPUT"
            echo "platforms=${{ github.event.inputs.platforms }}" >> "$GITHUB_OUTPUT"
          else
            echo "push=true" >> "$GITHUB_OUTPUT"
            echo "platforms=linux/amd64" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ steps.push.outputs.platforms }}
          push: ${{ steps.push.outputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Docker build"
            echo ""
            echo "- **GHCR**: \`${{ steps.names.outputs.ghcr_image }}\`"
            if [[ "${{ steps.names.outputs.dockerhub_enabled }}" == "true" ]]; then
              echo "- **Docker Hub**: \`${{ steps.names.outputs.dockerhub_image }}\`"
            else
              echo "- **Docker Hub**: skipped (set secret \`DOCKERHUB_TOKEN\`; user default yangye2)"
            fi
            echo "- **Push**: \`${{ steps.push.outputs.push }}\`"
            echo "- **Platforms**: \`${{ steps.push.outputs.platforms }}\`"
            echo ""
            echo "### Tags"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "### Pull"
            echo '```bash'
            echo "docker pull ${{ steps.names.outputs.ghcr_image }}:latest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
